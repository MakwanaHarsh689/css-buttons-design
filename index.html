<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Buttons Design</title>
<link rel="stylesheet" href="pr1.css">
</head>
<body>
<h1>CSS Buttons Design</h1>
<p>Different Styles, Sizes and Hover Effects</p>
<div class="button-box">
<h2>1. Button Styles</h2>
<button class="primary">Primary</button>
<button class="success">Success</button>
<button class="danger">Danger</button>
<button class="outline">Outline</button>
</div>
<div class="button-box">
<h2>2. Button Sizes</h2>
<button class="primary small">Small</button>
<button class="primary medium">Medium</button>
<button class="primary large">Large</button>
</div>
<div class="button-box">
<h2>3. Special Effects</h2>
<button class="rounded">Rounded</button>
<button class="gradient">Gradient</button>
<button class="shadow">Shadow</button>
<button class="disabled" disabled>Disabled</button>
</div>
</body>
</html>
